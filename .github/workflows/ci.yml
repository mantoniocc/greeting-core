name: CI

on:
    push:
        branches: [main]
    pull_request: 
        branches: [main]
    workflow_dispatch: 

# Least privilege a nivel de workflow. Ningun job pede escribir nada
# salvo que lo declare explicitamente
permissions: 
    contents: read

# Si pusheas tres veces seguidas, solo corre el ultimo run.
concurrency: 
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

jobs:
    test:
        name: Test · Node ${{matrix.node}}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: ['22', '24']
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node ${{matrix.node}}
              uses: actions/setup-node@v7
              with:
                node-version: ${{matrix.node}}
                cache: npm

            - name: Test
              run: npm test

    package:
        name: Verificar contenido del tarball
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            
            - name: Setup Node (version del proyecto)
              uses: actions/setup-node@v7
              with:
                node-version-file: .nvmrc
                cache: npm
            
            - name: Install
              run: npm ci

            - name: Lista contenido que se publicaria
              run: npm pack --dry-run

            - name: Falar si se colaron tests o workflows
              run: |
                npm pack --dry-run --json > pack.json
                if grep -qE '"path": *"(test/|\.github/)' pack.json; then
                    echo "::error::El tarball incluye archivos que no deberían publicarse"
                    exit 1
                fi
                echo "Contenido del tarball verificado"

            - name: Construir tarball
              run: npm pack

            - name: Subir tarball como artifact
              uses: actions/upload-artifact@v7
              with:
                name: package-tarball
                path: '*.tgz'
                retention-days: 7

            
              
