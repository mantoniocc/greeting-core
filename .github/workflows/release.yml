name: Release

on:
    release: 
        # 'published' y NO 'created': created tambien dispara al guardar
        # un borrador, lo que publicaria un paquete que no querias sacar.
        types: [published]

# Piso de permisos para todo el workflow.
permissions: 
    contents: read

jobs:
    verify:
        name: Verificar release
        runs-on: ubuntu-latest
        outputs:
            version: ${{steps.check.outputs.version}}
        steps:
            - name: Checkout (tag del release)
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version-file: .nvmrc
                cache: npm

            - name: Install
              run: npm ci

            - name: El tag debe coincidir con package.json
              id: check
              env:
                TAG: ${{github.event.release.tag_name}}
              run: |
                TAG_VERSION="${TAG#v}"
                PKG_VERSION="$(npm pkg get version | tr -d '"')"

                echo "Tag del release   : $TAG (version: $TAG_VERSION)"
                echo "package.json"     : $PKG_VERSION

                if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
                    echo "::error::Desincronización: el tag dice '$TAG_VERSION' pero package.json dice '$PKG_VERSION'. Usá 'npm version' para bumpear y taggear de forma atómica."
                    exit 1
                fi

                echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
                echo "Versiones sincronizadas: $PKG_VERSION"

            - name: Test
              run: npm test
            
            - name: Verificar contenido del tarball
              run: |
                npm pack --dry-run --json > pack.json
                if grep -qE '"path": *"(test/|\.github/)' pack.json; then
                    echo "::error::El tarball incluye archivos que no deberían publicarse"
                    exit 1
                fi
                npm pack --dry-run
        
    publish:
        name: Publicar en Github Packages
        runs-on: ubuntu-latest
        needs: verify
        permissions: 
            contents: read
            packages: write
            # Mintea el token OIDC para pedir el certificado a Sigstore.
            id-token: write
            # Persiste la attestation en el store de Github
            attestations: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node + registry de Github Packages
              uses: actions/setup-node@v7
              with:
                node-version-file: .nvmrc
                registry-url: https://npm.pkg.github.com
                scope: '@mantoniocc'
                cache: npm
            
            - name: Install
              run: npm ci

            # Empaquetamos UNA vez. Este archivo exacto es el que se
            # atestigua y el que se publica: mismo byte, mismo digest.
            - name: Empaquetar
              id: pack
              run: |
                TARBALL="$(npm pack --silent)"
                echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
                echo "Tarball: $TARBALL"
                shasum -a 256 "$TARBALL"

            - name: Generar attestation de procedencia
              uses: actions/attest@v4
              with:
                subject-path: ${{steps.pack.outputs.tarball}}

            - name: Publicar ese mismo tarball
              run: npm publish "${{steps.pack.outputs.tarball}}"
              env: 
                # token efimero del workflow. NO es un PAT
                NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

            - name: Resumen
              env:
                VERSION: ${{needs.verify.outputs.version}}
                TARBALL: ${{steps.pack.outputs.tarball}}
              run: |
                  DIGEST="$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)"
                    {
                        echo "## Publicado"
                        echo ""
                        echo "| | |"
                        echo "|---|---|"
                        echo "| Paquete | \`@mantoniocc/greeting-core\` |"
                        echo "| Versión | \`$VERSION\` |"
                        echo "| SHA-256 | \`$DIGEST\` |"
                        echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
                        echo "| Attestation | sí |"
                        echo ""
                        echo '```bash'
                        echo "npm pack @mantoniocc/greeting-core@$VERSION"
                        echo "gh attestation verify ./$TARBALL --owner mantoniocc"
                        echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

    smoke-test:
        name: Smoke test del paquete publicado
        runs-on: ubuntu-latest
        needs: [verify, publish]
        permissions: 
            contents: read
            # Lectura del propio package del repo. NO se necesita PAT.
            packages: read
        steps:
            - name: Setup Node + registry
              uses: actions/setup-node@v7
              with:
                node-version: '24'
                registry-url: https://npm.pkg.github.com
                scope: '@mantoniocc'

            - name: Esperar propagación del registry
              run: sleep 15

            - name: Instalar el paquete recien publicado
              env:
                NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
                VERSION: ${{needs.verify.outputs.version}}
              run: |
                mkdir -p /tmp/smoke && cd /tmp/smoke
                npm init -y > /dev/null
                npm install "@mantoniocc/greeting-core@$VERSION"
                echo "Instalado desde el registry:"
                npm ls "@mantoniocc/greeting-core"

            - name: Verificar que la API publica funciona
              run: |
                cd /tmp/smoke
                cat > smoke.mjs <<'EOF'
                import assert from "node:assert/strict";
                import { greet, SUPPORTED_LOCALES } from "@mantoniocc/greeting-core";

                assert.equal(greet(), "Hello, world!");
                assert.equal(greet("Ada", { locale: "es" }), "¡Hola, Ada!");
                assert.ok(Array.isArray(SUPPORTED_LOCALES));
                assert.ok(SUPPORTED_LOCALES.length > 0);

                for (const locale of SUPPORTED_LOCALES) {
                    assert.doesNotThrow(() => greet("Ada", { locale }));
                }

                console.log("Smoke test OK — el paquete publicado es consumible");
                EOF
                node smoke.mjs

            - name: Verificar la integridad del lockfile
              run: |
                cd /tmp/smoke
                node -e "
                    const lock = require('./package-lock.json');
                    const key = 'node_modules/@mantoniocc/greeting-core';
                    const entry = lock.packages[key];
                    if (!entry?.integrity?.startsWith('sha512-')) {
                    console.error('::error::Sin hash de integridad en el lockfile');
                    process.exit(1);
                    }
                    console.log('Resolved  :', entry.resolved);
                    console.log('Integrity :', entry.integrity.slice(0, 40) + '...');
                "
          
        

